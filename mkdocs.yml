site_name: bsllmner-mk2 Documentation
site_url: https://dbcls.github.io/bsllmner-mk2
repo_name: dbcls/bsllmner-mk2
repo_url: https://github.com/dbcls/bsllmner-mk2
edit_uri: edit/main/docs/
copyright: Copyright &copy; DBCLS

theme:
  name: material
  palette:
    primary: teal
    accent: amber
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Basics:
      - Getting Started: getting-started.md
      - Installation: installation.md
  - Modes:
      - Extract Mode: extract-mode.md
      - Select Mode: select-mode.md
  - Reference:
      - CLI: cli.md
      - Data Formats: data-formats.md
      - Configuration: configuration.md
  - Operations:
      - Ontology Preparation: ontology.md
      - ChIP-Atlas: chip-atlas.md
  - Contributing:
      - Development: development.md
      - Testing: testing.md
      - Benchmarking: benchmarking.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dbcls/bsllmner-mk2

validation:
  # `not_found` accepts only warn/info/ignore. CI runs `mkdocs build --strict`,
  # which promotes warnings to build failures, so `warn` is effectively `error`.
  links:
    not_found: warn
